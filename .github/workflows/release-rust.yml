name: release-rust
"on":
  workflow_call: null
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Verify package
        run: cargo package
      - env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        name: Publish crate `kudu-macros`
        run: cargo publish -p kudu-macros
      - env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        name: Publish crate `kudu`
        run: cargo publish -p kudu
      - env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        name: Publish crate `kudu-esr`
        run: cargo publish -p kudu-esr
      - env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        name: Publish crate `kudune`
        run: cargo publish -p kudune
