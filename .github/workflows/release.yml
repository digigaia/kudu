name: release
"on":
  push:
    tags:
      - '*'
permissions:
  contents: read
  id-token: write
  attestations: write
jobs:
  test-rust:
    uses: ./.github/workflows/tests-rust.yml
  test-python:
    needs: test-rust
    uses: ./.github/workflows/tests-python.yml
  release-rust:
    needs: test-rust
    uses: ./.github/workflows/release-rust.yml
    secrets: inherit
  release-python:
    needs: test-python
    uses: ./.github/workflows/release-python.yml
