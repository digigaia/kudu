name: release
"on":
  push:
    tags:
      - '*'
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test-rust:
    uses: ./.github/workflows/tests-rust.yml
  test-python:
    needs: test-rust
    uses: ./.github/workflows/tests-python.yml
  release-rust:
    needs: test-rust
    uses: ./.github/workflows/release-rust.yml
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
  release-python:
    needs: test-python
    uses: ./.github/workflows/release-python.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
